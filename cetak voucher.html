    <style>
        :root {
            --my-color: #0371fe;
            --black-color: #000000;
            --gray-color: gray;
            --white-color: #ffffff;
            --alice-color: #edf1fc;
            --red-color: #dc3546;
            --abu-color: #ccc;
            --transparent-color: transparent;
        }

        body {
            font-family: "Poppins", sans-serif;
            background-color: var(--alice-color);
            font-size: 14px;
            font-weight: 400;
            margin: 0;
            padding: 0;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        .flex {
            display: flex;
        }
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: var(--my-color);
            z-index: 1;
            padding: 8px 16px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
        }
        .image-operator img {
            width: 40px;
            border: none;
            background: var(--white-color);
            border-radius: 100px;
        }
        .nama-produk h1 {
            font-size: 15px;
            color: var(--black-color);
            margin-top: 15px;
            margin-left: 10px;
            font-weight: 500;
        }
        .card-box {
            padding: 10px;
            background-color: var(--white-color);
            border-radius: 20px;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            margin-top: 12px;           
            transition: background-color 0.3s ease;
        }
        .arrow {
            font-size: 15px;
            font-weight: bold;
            margin-top: 20px;
            margin-right: 10px;
            color: var(--my-color);
        }
        .search-box {
            flex: 1;
        }
        .search-input {
            width: 100%;
            padding:14px;
            border-radius: 12px;
            border: 1px solid var(--abu-color);
            font-size: 15px;
            font-weight: 500;
            outline:none;
            box-shadow:none;
            box-sizing: border-box;
        }
        /* Dark Mode Styles */
        body.dark-mode header {
            background: #222;
        }

        .dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }

        .dark-mode .app-bar-top {
            background-color: #1f1f1f;
            color: #e0e0e0;
        }

       
        .dark-mode .card-box {
            background-color: #1e1e1e;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.7);
            padding-left: 5px; 
            
        }

        .dark-mode .saldo-icon i {
            color: #82aaff;
        }

        .dark-mode .saldo-text .title {
            color: #bbbbbb;
        }

        .dark-mode .saldo-text .amount {
            color: #ffffff;
        }

        .dark-mode .saldo-actions a {
            color: #82aaff;
        }

        .dark-mode .nama-produk h1 {
            color: #ffffff;
        }

        .dark-mode .nama-produk p {
            color: #bbbbbb;
        }

        .dark-mode a {
            color: #82aaff;
        }

        /* Container for padding around contents */
        .container {
            max-width: 700px;
            margin: 7px auto 24px;
            padding: 0 16px 24px;
            box-sizing: border-box;
        }
        /* Dark mode toggle wrapper */
        .switch {
            display: none;
            justify-content: flex-end;
            margin-bottom: 16px;
            position: sticky;
            top: 60px;
            background: var(--alice-color);
            padding-bottom: 8px;
            z-index: 2;
        }
        .slider {
            cursor: pointer;
            width: 50px;
            height: 24px;
            background-color: #ccc;
            border-radius: 34px;
            position: relative;
            transition: background-color 0.3s;
        }
        .slider::before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: 0.4s;
        }
        input[type="checkbox"]:checked + .slider {
            background-color: var(--my-color);
        }
        input[type="checkbox"]:checked + .slider::before {
            transform: translateX(26px);
        }

        .nama-produk h1 {
            margin-top: 0;
            margin-left: 1px;
            font-size:15px;
            font-weight:500;
            color: var(--black-color);
        }
        /* Adjust card flex and alignment */
        .card-box a > .flex {
            align-items: center;
            gap: 10px;
        }
        /* Remove margin-top on arrow icon and center vertically */
        .arrow {
            margin-top: 0;
            color: var(--my-color);
            font-size: 18px;
        }
    </style>
</head>

    <script>
        const darkToggleCheckbox = document.getElementById("darkModeToggle");

        // Load saved preference
        if (localStorage.getItem("darkMode") === "enabled") {
            document.body.classList.add("dark-mode");
            darkToggleCheckbox.checked = true;
        } else {
            darkToggleCheckbox.checked = false;
        }

        // Listen toggle change
        darkToggleCheckbox.addEventListener("change", () => {
            if (darkToggleCheckbox.checked) {
                document.body.classList.add("dark-mode");
                localStorage.setItem("darkMode", "enabled");
            } else {
                document.body.classList.remove("dark-mode");
                localStorage.setItem("darkMode", "disabled");
            }
        });

        // Search filter function
        function filterProducts() {
            const input = document.getElementById("searchInput");
            const filter = input.value.toLowerCase();
            const cards = document.querySelectorAll(".card-box");

            cards.forEach((card) => {
                const name = card.getAttribute("data-name").toLowerCase();
                if (name.includes(filter)) {
                    card.style.display = "";
                } else {
                    card.style.display = "none";
                }
            });
        }
    </script>
